[package]
name = "pdvrdt"
version = "4.9.0"
edition = "2021"
description = "Linux-only PNG data-vehicle steganography tool (pdvrdt-rs)"
license = "MIT"
readme = "README.md"
autobins = false
publish = false

[lib]
name = "pdvrdt"
path = "src/lib.rs"

[[bin]]
name = "pdvrdt-rs"
path = "src/main.rs"

[dependencies]
alkali = "0.3"
flate2 = "1.0"
png = "0.17"
crc32fast = "1.4"
libc = "0.2"
zeroize = { version = "1", features = ["derive"] }
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
strip = true
